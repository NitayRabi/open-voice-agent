<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Open Voice Agent</title>
    <link rel="stylesheet" href="./styles/web.css" />
  </head>
  <body>
    <header>
      <div class="brand-lockup"><img class="brand-mark" src="./assets/icon.png" alt="" aria-hidden="true" /><span class="brand">Open Voice Agent</span></div>
      <a id="settings-link" href="./settings" aria-label="Open settings"><span>Settings</span></a>
    </header>

    <main>
      <section class="voice-card">
      <div class="orb-row">
      <div id="orb" class="orb state-idle" role="button" tabindex="0" aria-label="Toggle voice">
        <div class="orb-glow-bg" aria-hidden="true"></div>
        <div class="orb-glow-pulse" aria-hidden="true"></div>
        <img class="orb-icon" src="./assets/icon.png" alt="Open Voice Agent" draggable="false" />
      </div>
      <button id="agent-switch" type="button">Agent</button>
      </div>
      <p id="caption">tap to talk</p>
      <p id="notice" hidden></p>
      </section>
      <div id="transcript" aria-live="polite"></div>
    </main>

    <script type="module" src="./web.js"></script>
  </body>
</html>
